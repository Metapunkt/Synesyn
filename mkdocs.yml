# Documentation site configuration.
#
# The site is generated from docs/ so there is a single source of truth: the same
# files are read on GitHub and served here. Nothing is authored for the site alone.
#
# Preview locally:
#   pip install -r utilities/docs/requirements.txt
#   mkdocs serve
#
# Publishing is deliberately dormant. GitHub Pages cannot serve a private
# repository on the free organisation plan, and on paid plans the site would be
# public by default, so the deploy job in .github/workflows/docs.yml stays off
# until the repository itself is public. See utilities/docs/README.md.

site_name: Synesyn
copyright: >-
  © 2025 “Synesyn” by Ayodele Arigbabu, Norwegian University of Science and Technology.
  Documentation is CC BY-SA 4.0.
site_description: >-
  Local-first, artifact-centric platform for groups to reason with AI about possible
  futures, drawing them out of material they already hold and building up a
  traceable record from one session to the next.
site_url: https://metapunkt.github.io/Synesyn/

repo_url: https://github.com/Metapunkt/Synesyn
repo_name: Metapunkt/Synesyn
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.smartsymbols

# Maintainer notes and templates that belong in the tree rather than in the
# reader-facing navigation.
not_in_nav: |
  assets/screenshots/CAPTURE_GUIDE.md
  product-requirements/_template.md

# Surface documentation rot as build warnings, so --strict in CI fails on it.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

plugins:
  - search

