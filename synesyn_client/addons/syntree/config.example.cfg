; SynTree configuration template.
;
; Copy this file to `config.cfg` in the same directory and fill in the values
; you need. `config.cfg` is listed in .gitignore and is never committed, so
; your keys stay local.
;
; Only the providers you actually use need a key. Leave the rest empty.

[api]

; Anthropic (Claude). https://console.anthropic.com/settings/keys
anthropic_key=""

; OpenAI. https://platform.openai.com/api-keys
openai_key=""

; Google (Gemini). https://aistudio.google.com/apikey
google_key=""

; Base URL for the default provider. Override to point at a proxy or a
; self-hosted, OpenAI-compatible endpoint.
base_url="https://api.anthropic.com/v1"

[ai]

default_model="claude-3-5-sonnet-20241022"
temperature=0.7
max_tokens=2000

[ui]

theme="default"
font_size=14
show_timestamps=true
