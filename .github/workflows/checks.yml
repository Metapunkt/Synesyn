name: Checks

# Policy checks and hub tests. Unlike the docs workflow, this is not path-filtered:
# moving a script breaks paths written in documentation, so the check has to run on
# code changes too, not only documentation ones.
#
# ScenSyn harness specs are not run here (live hub session). ReadyMade has a
# headless acceptance scene that only needs Godot + LimboAI binaries; that job
# is wired below. Recommended / tested-with builds (not shipped by Synesyn)
# live in utilities/checks/tool_versions.env — users install them themselves.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/synesyn_hub/requirements-dev.txt

      - name: Documented paths still exist
        run: python utilities/checks/check_doc_paths.py

      - name: Addons do not reach into application autoloads
        run: python utilities/checks/check_addon_autoloads.py

      # Advisory, deliberately. The ratchet currently reports eight baselined
      # files that have grown, the largest by ~98 lines, against six that shrank.
      # That debt is known and scheduled rather than fixed in passing, and it
      # predates this workflow, so it is surfaced on every run without blocking.
      # When the drift is cleared, drop continue-on-error and this comment.
      - name: Line-limit ratchet (advisory)
        continue-on-error: true
        run: python utilities/checks/check_line_limits.py --check-baseline

      - name: Install hub test dependencies
        working-directory: services/synesyn_hub
        run: pip install -r requirements-dev.txt

      - name: Hub tests
        working-directory: services/synesyn_hub
        run: python -m pytest tests/ -q

  readymade-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load recommended tool versions
        id: pins
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source utilities/checks/tool_versions.env
          {
            echo "godot_version=${GODOT_VERSION}"
            echo "godot_url=${GODOT_DOWNLOAD_URL}"
            echo "godot_sha256=${GODOT_SHA256}"
            echo "godot_zip=${GODOT_ZIP_NAME}"
            echo "limboai_version=${LIMBOAI_VERSION}"
            echo "limboai_url=${LIMBOAI_DOWNLOAD_URL}"
            echo "limboai_sha256=${LIMBOAI_SHA256}"
            echo "limboai_zip=${LIMBOAI_ZIP_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Install Godot (recommended / tested-with)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/godot.zip "${{ steps.pins.outputs.godot_url }}"
          echo "${{ steps.pins.outputs.godot_sha256 }}  /tmp/godot.zip" | sha256sum -c -
          sudo unzip -o /tmp/godot.zip -d /usr/local/bin
          # Stable linux zip contains Godot_vX.Y.Z-stable_linux.x86_64 (no .exe).
          GODOT_BIN_NAME="$(basename "${{ steps.pins.outputs.godot_zip }}" .zip)"
          sudo mv "/usr/local/bin/${GODOT_BIN_NAME}" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version
          echo "Recommended Godot (CI tested-with): ${{ steps.pins.outputs.godot_version }}"

      - name: Install LimboAI GDExtension (recommended / tested-with)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/limboai.zip "${{ steps.pins.outputs.limboai_url }}"
          echo "${{ steps.pins.outputs.limboai_sha256 }}  /tmp/limboai.zip" | sha256sum -c -
          unzip -o /tmp/limboai.zip -d /tmp/limboai
          mkdir -p synesyn_client/addons/limboai/bin
          cp -a /tmp/limboai/addons/limboai/bin/. synesyn_client/addons/limboai/bin/
          test -f synesyn_client/addons/limboai/bin/limboai.gdextension
          echo "Recommended LimboAI (CI tested-with): ${{ steps.pins.outputs.limboai_version }} (${{ steps.pins.outputs.limboai_zip }})"

      - name: Fresh-clone import smoke (LimboAI / parse errors)
        run: |
          set -euo pipefail
          chmod +x utilities/checks/run_fresh_import_smoke.sh
          GODOT_BIN="$(command -v godot)" utilities/checks/run_fresh_import_smoke.sh

      - name: Import project + run ReadyMade acceptance
        run: |
          set -euo pipefail
          # .godot already built by fresh-import smoke; re-import is cheap/idempotent.
          godot --headless --path synesyn_client --import --quit-after 60
          chmod +x utilities/checks/run_readymade_acceptance.sh
          GODOT_BIN="$(command -v godot)" utilities/checks/run_readymade_acceptance.sh
